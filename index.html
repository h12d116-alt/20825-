      // ======================================================================
      const ALLERGEN_KNOWLEDGE_BASE = {

        대두: ["대두", "콩", "두부", "간장", "된장", "고추장", "콩기름", "대두유", "레시틴", "대두단백", "콩나물", "두유", "soy"],

        아황산류: ["아황산", "아황산나트륨", "메타중아황산칼륨", "이산화황", "산화방지제(아황산)", "와인", "건포도"],

      const AMBIGUOUS_COMPOUND_KEYWORDS = [
        "복합조미식품", "향미증진제", "특제소스", "비법소스", "비밀양념", "시즈닝",

        "스톡", "엑기스", "농축액", "분말스프", "조미료", "기타가공품"
      ];

      // ======================================================================
      // 2. 보조 AI: 기계학습 기능 시연용 프로토타입 (MLClassifierPrototype)
      // ======================================================================
      class MLClassifierPrototype {
        static PROTOTYPE_LABEL =
          "기계학습 기능 시연용 프로토타입 (규칙·키워드 기반 NLP 분류 모듈 - 추후 실제 학습 모델로 교체 가능)";

        static classifyText(rawText, userAllergens) {
          const text = (rawText || "").trim();

          // 1) 알레르기 유발 성분 언급 추출
          const extractedAllergens = [];
          const searchTargets = Array.from(new Set([...Object.keys(ALLERGEN_KNOWLEDGE_BASE), ...userAllergens]));

          for (const allergen of searchTargets) {
            const synonyms = ALLERGEN_KNOWLEDGE_BASE[allergen] || [allergen];
            for (const syn of synonyms) {
              if (text.toLowerCase().includes(syn.toLowerCase())) {
                const negPattern = new RegExp(`${syn}[은는이가\\s]*(안|없|미포함|제외)`);
                if (!negPattern.test(text) && !extractedAllergens.includes(allergen)) {
                  extractedAllergens.push(allergen);
                }
              }
            }
          }

          // 2) 원재료명 및 복합재료 분리
          const tokens = text
            .split(/[,/·\n()]+/)
            .map((t) => t.trim())
            .filter((t) => t.length >= 2 && t.length <= 20);

          const compoundIngredients = tokens.filter((token) =>
            AMBIGUOUS_COMPOUND_KEYWORDS.some((kw) => token.includes(kw))
          );
          const rawIngredients = tokens.filter((token) => !compoundIngredients.includes(token)).slice(0, 10);

          // 3) 소스 및 육수 관련 정보 추출
          const sauceBrothKw = ["소스", "육수", "채수", "양념", "간장", "된장", "고추장", "스톡", "드레싱", "국물", "베이스"];
          const extractedSauceBroth = tokens.filter((token) => sauceBrothKw.some((kw) => token.includes(kw)));

          // 4) 답변 불충분 / 모호성 판별
          const ambiguityTriggers = [
            "아마", "글쎄", "모르겠", "잘 모르", "확인해 봐야", "확인해봐야",
            "기성품", "납품", "그럴 수도", "확실하지", "안 적혀", "비밀"
          ];
          const detectedAmbiguous = ambiguityTriggers.filter((phrase) => text.includes(phrase));
          const isTooShort = text.length < 4;
          const isAmbiguous = detectedAmbiguous.length > 0 || isTooShort;

          let reason = "명확한 원재료 또는 포함 여부 진술이 감지되었습니다.";
          if (isTooShort) {
            reason = "입력된 텍스트가 너무 짧아 충분한 정보를 추출할 수 없습니다.";
          } else if (detectedAmbiguous.length > 0) {
            const joined = detectedAmbiguous.map((p) => `'${p}'`).join(", ");
            reason = `불확실성을 나타내는 표현(${joined})이 포함되어 있습니다.`;
          }

          return {
            isPrototypeNotice: MLClassifierPrototype.PROTOTYPE_LABEL,
            hasAllergenMention: {
              detected: extractedAllergens.length > 0,
              extractedAllergens,
              confidenceScore: text.length > 5 ? 0.88 : 0.52
            },
            ingredientsAndCompounds: {
              rawIngredients,
              compoundIngredients
            },
            sauceAndBrothInfo: {
              detected: extractedSauceBroth.length > 0,
              extractedTerms: extractedSauceBroth
            },
            ambiguityAnalysis: {
              isAmbiguous,
              ambiguousPhrases: detectedAmbiguous,
              reason
            }
          };
        }
      }

      // ======================================================================
      // 3. 핵심 AI: 규칙 기반 추론 엔진 (InferenceEngine)
      // ======================================================================
      class InferenceEngine {
        static evaluate(userAllergens, foodSections, mlResult = null) {
          const ruleTrace = [];
          const matchedAllergens = [];
          const ambiguousItems = [];

          const combinedText = [
            foodSections.ingredients,
            foodSections.sauce,
            foodSections.broth,
            foodSections.topping,
            foodSections.staffNote
          ]
            .filter(Boolean)
            .join(" ")
            .trim();

          // [RULE-01] 원재료 정보 유효성 검증 규칙
          const isInsufficient = combinedText.length < 2 || combinedText === "정보 없음" || combinedText === "미등록";
          ruleTrace.push({
            ruleId: "RULE-01",
            ruleName: "원재료 정보 유효성 검증 규칙",
            description: "입력된 원재료/메뉴 정보가 비어있거나 2자 미만인 경우 [정보 부족]으로 분류합니다.",
            triggered: isInsufficient
          });

          if (isInsufficient) {
            return {
              status: "INSUFFICIENT_INFO",
              statusLabel: "정보 부족",
              matchedAllergens: [],
              ambiguousItems: ["등록된 원재료 정보가 없습니다."],
              ruleTrace,
              summaryMessage: "원재료 정보가 등록되지 않았거나 너무 부족하여 알레르기 여부를 판단할 수 없습니다."
            };
          }

          // [RULE-02] 직접 및 파생 알레르겐 매칭 규칙
          const sectionEntries = [
            { label: "주원재료", text: foodSections.ingredients || "" },
            { label: "소스", text: foodSections.sauce || "" },
            { label: "육수", text: foodSections.broth || "" },
            { label: "토핑", text: foodSections.topping || "" },
            { label: "직원 답변/비고", text: foodSections.staffNote || "" }
          ];

          for (const userAllergen of userAllergens) {
            const normalized = userAllergen.trim();
            const synonyms = ALLERGEN_KNOWLEDGE_BASE[normalized] || [normalized];

            for (const section of sectionEntries) {
              if (!section.text) continue;
              const lowerSec = section.text.toLowerCase();

              for (const keyword of synonyms) {
                if (lowerSec.includes(keyword.toLowerCase())) {
                  const exists = matchedAllergens.some(
                    (m) =>
                      m.userAllergen === normalized &&
                      m.matchedKeyword === keyword &&
                      m.location === section.label
                  );
                  if (!exists) {
                    matchedAllergens.push({
                      userAllergen: normalized,
                      matchedKeyword: keyword,
                      location: section.label
                    });
                  }
                }
              }
            }
          }

          const hasMatch = matchedAllergens.length > 0;
          ruleTrace.push({
            ruleId: "RULE-02",
            ruleName: "알레르겐 및 파생 원재료 매칭 규칙 (최우선 경고)",
            description:
              "사용자 등록 알레르겐 및 파생어가 원재료·소스·육수·토핑에서 발견되면 즉시 [알레르기 유발 성분 확인]으로 판정합니다.",
            triggered: hasMatch
          });

          if (hasMatch) {
            const uniqueAllergens = Array.from(new Set(matchedAllergens.map((m) => m.userAllergen)));
            return {
              status: "ALLERGEN_DETECTED",
              statusLabel: "알레르기 유발 성분 확인",
              matchedAllergens,
              ambiguousItems: [],
              ruleTrace,
              summaryMessage: `주의! 등록하신 알레르기 유발 성분(${uniqueAllergens.join(", ")}) 또는 관련 파생 원재료가 확인되었습니다.`
            };
          }

          // [RULE-03] 복합재료·육수·소스 세부 성분 검증 규칙
          for (const section of sectionEntries) {
            if (!section.text) continue;
            for (const ambWord of AMBIGUOUS_COMPOUND_KEYWORDS) {
              if (section.text.includes(ambWord)) {
                const hasDetail = new RegExp(`${ambWord}\\s*\\([^)]+\\)`).test(section.text);
                if (!hasDetail) {
                  const desc = `${section.label}의 '${ambWord}' (세부 원재료 미표기)`;
                  if (!ambiguousItems.includes(desc)) {
                    ambiguousItems.push(desc);
                  }
                }
              }
            }
          }

          if (mlResult && mlResult.ambiguityAnalysis.isAmbiguous) {
            ambiguousItems.push(`직원 답변 모호성 감지: ${mlResult.ambiguityAnalysis.reason}`);
          }

          const needsVerification = ambiguousItems.length > 0;
          ruleTrace.push({
            ruleId: "RULE-03",
            ruleName: "복합재료·육수·소스 세부 성분 검증 규칙",
            description:
              "직접 알레르겐은 없으나 세부 원재료가 명시되지 않은 소스, 육수, 복합조미식품이 포함되었거나 답변이 모호한 경우 [추가 확인 필요]로 판정합니다.",
            triggered: needsVerification
          });

          if (needsVerification) {
            return {
              status: "NEEDS_VERIFICATION",
              statusLabel: "추가 확인 필요",
              matchedAllergens: [],
              ambiguousItems,
              ruleTrace,
              summaryMessage:
                "등록된 알레르기 성분이 직접 표기되지는 않았으나, 세부 성분이 불명확한 소스·육수·복합재료가 있어 추가 확인이 필요합니다."
            };
          }

          // [RULE-04] 표시 성분 내 미발견 판정 규칙 (보수적 안전 원칙)
          ruleTrace.push({
            ruleId: "RULE-04",
            ruleName: "표시 성분 내 미발견 판정 규칙 (보수적 안전 원칙)",
            description:
              "제공된 원재료 정보에서 등록 알레르겐이 발견되지 않았더라도 교차 오염 가능성을 고려해 [안전함] 대신 [표시된 성분에서 등록 알레르겐 미발견]으로 판정합니다.",
            triggered: true
          });

          return {
            status: "NOT_FOUND_IN_LIST",
            statusLabel: "표시된 성분에서 등록 알레르겐 미발견",
            matchedAllergens: [],
            ambiguousItems: [],
            ruleTrace,
            summaryMessage:
              "표시된 원재료 정보에서는 등록하신 알레르기 유발 성분이 발견되지 않았습니다. (조리 과정의 교차 오염 여부는 별도 확인을 권장합니다.)"
          };
        }
      }

          restaurantName: "[예시 식당] 한그릇 온면집",
          tableNumber: "테이블 02번",
          menuName: "신메뉴 계절 비빔밥 (원재료 미등록)",
          ingredients: "",
          sauce: "",
          broth: "",
          topping: "",
          source: "UNVERIFIED",
          updatedAt: "미등록",
          isSampleData: true
        }
      ];

      const OCR_PRESETS = [
        {
          id: "ocr-1",
          label: "예시 라벨 ① 고소함 가득 아몬드 초코쿠키",
          productName: "고소함 가득 아몬드 초코쿠키",
          extractedText: "밀가루(밀:미국산), 백설탕, 가공버터(우유), 코코아분말, 전란액(달걀), 아몬드분태 8%, 대두레시틴(대두), 정제소금, 합성향료(바닐린)"
        },
        {
          id: "ocr-2",
          label: "예시 라벨 ② 담백한 현미 쌀과자",
          productName: "담백한 현미 쌀과자",
          extractedText: "현미(국산) 94%, 찹쌀(국산) 5%, 천일염(국산) 1%"
        },
        {
          id: "ocr-3",
          label: "예시 라벨 ③ 매콤달콤 떡볶이 밀키트",
          productName: "매콤달콤 떡볶이 밀키트",
          extractedText: "쌀떡(쌀, 정제소금, 주정), 어묵(연육, 밀가루, 대두유), 떡볶이특제소스, 복합조미식품, 건조대파"
        }
      ];

      const speakKorean = (text, onEnd) => {
        if (typeof window === "undefined" || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "ko-KR";
        utterance.rate = 0.98;
        if (onEnd) {
          utterance.onend = onEnd;
          utterance.onerror = onEnd;
        }
        window.speechSynthesis.speak(utterance);
      };

      // ======================================================================
      // 5. 메인 애플리케이션 컴포넌트
      // ======================================================================
      function App() {
        const [activeTab, setActiveTab] = useState("home");
        const [fontScale, setFontScale] = useState("normal");
        const [isSpeaking, setIsSpeaking] = useState(false);

        const [userAllergens, setUserAllergens] = useState(() => {
          try {
            const saved = localStorage.getItem("safebite_user_allergens");
            return saved ? JSON.parse(saved) : ["땅콩", "우유", "새우"];
          } catch {
            return ["땅콩", "우유", "새우"];
          }
        });
        const [customAllergenInput, setCustomAllergenInput] = useState("");

        const [foodNameInput, setFoodNameInput] = useState("고소함 가득 아몬드 초코쿠키");
        const [ocrTextInput, setOcrTextInput] = useState(OCR_PRESETS[0].extractedText);
        const [uploadedFileName, setUploadedFileName] = useState(null);
        const [isOcrProcessing, setIsOcrProcessing] = useState(false);

        const [restaurantMenus, setRestaurantMenus] = useState(() => {
          try {
            const saved = localStorage.getItem("safebite_restaurant_menus");
            const customMenus = saved ? JSON.parse(saved) : [];
            return [...customMenus, ...INITIAL_SAMPLE_MENUS];
          } catch {
            return INITIAL_SAMPLE_MENUS;
          }
        });
        const [selectedRestaurantFilter, setSelectedRestaurantFilter] = useState("ALL");
        const [qrScanNotice, setQrScanNotice] = useState(null);

        const [regRestaurantName, setRegRestaurantName] = useState("우리동네 바른식당");
        const [regMenuName, setRegMenuName] = useState("");
        const [regIngredients, setRegIngredients] = useState("");
        const [regSauce, setRegSauce] = useState("");
        const [regBroth, setRegBroth] = useState("");
        const [regTopping, setRegTopping] = useState("");
        const [registerFeedback, setRegisterFeedback] = useState(null);

        const [questionTargetMenu, setQuestionTargetMenu] = useState("얼큰 해물 쌀국수");
        const [staffReplyInput, setStaffReplyInput] = useState(
          "육수는 해물 다시팩을 쓰는데 정확한 성분은 확인해 봐야 할 것 같고, 특제 매운 소스에는 땅콩가루가 조금 들어갑니다."
        );
        const [copiedQuestionIdx, setCopiedQuestionIdx] = useState(null);

        const [analysisHistory, setAnalysisHistory] = useState([]);
        const [selectedDetailRecord, setSelectedDetailRecord] = useState(null);

        useEffect(() => {
          try {
            localStorage.setItem("safebite_user_allergens", JSON.stringify(userAllergens));
          } catch (e) {}
        }, [userAllergens]);

        useEffect(() => {
          const root = document.documentElement;
          if (fontScale === "normal") root.style.fontSize = "16px";
          if (fontScale === "large") root.style.fontSize = "18.5px";
          if (fontScale === "xlarge") root.style.fontSize = "21px";
        }, [fontScale]);

        const handleSpeak = useCallback((text) => {
          setIsSpeaking(true);
          speakKorean(text, () => setIsSpeaking(false));
        }, []);

        const handleStopSpeak = useCallback(() => {
          if (typeof window !== "undefined" && "speechSynthesis" in window) {
            window.speechSynthesis.cancel();
          }
          setIsSpeaking(false);
        }, []);

        const toggleAllergen = (item) => {
          setUserAllergens((prev) => (prev.includes(item) ? prev.filter((a) => a !== item) : [...prev, item]));
        };

        const handleAddCustomAllergen = (e) => {
          e.preventDefault();
          const trimmed = customAllergenInput.trim();
          if (!trimmed) return;
          if (!userAllergens.includes(trimmed)) setUserAllergens((prev) => [...prev, trimmed]);
          setCustomAllergenInput("");
        };

        const handleClearAllAllergens = () => {
          setUserAllergens([]);
          handleSpeak("등록된 모든 알레르기 정보가 삭제되었습니다.");
        };

        const handleImageUpload = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          setUploadedFileName(file.name);
          setIsOcrProcessing(true);
          setTimeout(() => {
            setIsOcrProcessing(false);
            const matchedPreset = file.name.includes("쌀") || file.name.includes("과자")
              ? OCR_PRESETS[1]
              : file.name.includes("떡")
              ? OCR_PRESETS[2]
              : OCR_PRESETS[0];
            setFoodNameInput(matchedPreset.productName);
            setOcrTextInput(matchedPreset.extractedText);
            handleSpeak("사진에서 원재료 텍스트 추출이 완료되었습니다. 오인식된 글자가 있는지 확인 후 분석하기 버튼을 눌러주세요.");
          }, 600);
        };

        const handleAnalyzePackagedFood = () => {
          const mlClassification = MLClassifierPrototype.classifyText(ocrTextInput, userAllergens);
          const inference = InferenceEngine.evaluate(userAllergens, { ingredients: ocrTextInput }, mlClassification);
          const newRecord = {
            id: `rec-${Date.now()}`,
            targetName: foodNameInput.trim() || "포장식품 원재료 분석",
            inference,
            mlClassification,
            source: "OFFICIAL_LABEL",
            updatedAt: new Date().toISOString().split("T")[0]
          };
          setAnalysisHistory((prev) => [newRecord, ...prev]);
          setSelectedDetailRecord(newRecord);
          handleSpeak(`분석 결과: ${inference.statusLabel}. ${inference.summaryMessage}`);
        };

        const handleInspectRestaurantMenu = (menu) => {
          const combinedRaw = [menu.ingredients, menu.sauce, menu.broth, menu.topping].filter(Boolean).join(", ");
          const mlClassification = MLClassifierPrototype.classifyText(combinedRaw, userAllergens);
          const inference = InferenceEngine.evaluate(userAllergens, menu, mlClassification);
          const record = {
            id: `menu-rec-${Date.now()}`,
            targetName: `${menu.restaurantName} - ${menu.menuName}`,
            inference,
            mlClassification,
            source: menu.source,
            updatedAt: menu.updatedAt
          };
          setAnalysisHistory((prev) => [record, ...prev]);
          setSelectedDetailRecord(record);
          handleSpeak(`${menu.menuName} 분석 결과: ${inference.statusLabel}. ${inference.summaryMessage}`);
        };

        const handleSimulateQrScan = (restaurantId, label) => {
          setSelectedRestaurantFilter(restaurantId);
          setQrScanNotice(`QR코드 인식 완료: ${label}의 최신 메뉴 원재료 정보를 불러왔습니다.`);
          handleSpeak(`${label} QR코드가 인식되었습니다. 메뉴별 알레르기 분석 결과를 확인하세요.`);
        };

        const handleRegisterRestaurantMenu = (e) => {
          e.preventDefault();
          if (!regMenuName.trim() || !regIngredients.trim()) {
            setRegisterFeedback("메뉴명과 주원재료는 필수 입력 항목입니다.");
            return;
          }
          const today = new Date().toISOString().split("T")[0];
          const newMenu = {
            id: `custom-menu-${Date.now()}`,
            restaurantId: "REST-CUSTOM-OWNER",
            restaurantName: regRestaurantName.trim() || "직접 등록 식당",
            tableNumber: "QR 테이블 연동됨",
            menuName: regMenuName.trim(),
            ingredients: regIngredients.trim(),
            sauce: regSauce.trim() || "없음",
            broth: regBroth.trim() || "없음",
            topping: regTopping.trim() || "없음",
            source: "RESTAURANT_DIRECT",
            updatedAt: today,
            isSampleData: false
          };
          const updatedMenus = [newMenu, ...restaurantMenus];
          setRestaurantMenus(updatedMenus);
          try {
            localStorage.setItem(
              "safebite_restaurant_menus",
              JSON.stringify(updatedMenus.filter((m) => !m.isSampleData))
            );
          } catch (err) {}
          setRegMenuName("");
          setRegIngredients("");
          setRegSauce("");
          setRegBroth("");
          setRegTopping("");
          setRegisterFeedback(`[${newMenu.menuName}] 메뉴가 '식당 직접 등록 정보' 출처로 저장되었습니다. (업데이트: ${today})`);
          handleSpeak(`${newMenu.menuName} 메뉴의 원재료 정보가 등록되었습니다.`);
        };

        const generatedQuestions = useMemo(() => {
          const allergyText = userAllergens.length > 0 ? userAllergens.join(", ") : "특정 알레르기 유발 성분";
          const menuLabel = questionTargetMenu.trim() || "선택하신 메뉴";
          return [
            `안녕하세요. 제가 [${allergyText}] 알레르기가 있어서 확인차 여쭤봅니다. '${menuLabel}'의 소스나 양념에 해당 성분이 포함되어 있나요?`,
            `이 메뉴에 사용되는 육수, 채수 또는 기성품 조미료의 세부 원재료에 [${allergyText}] 성분이 들어가는지 확인할 수 있을까요?`,
            `조리 과정에서 [${allergyText}] 성분이 들어간 다른 메뉴와 같은 조리 기구나 튀김기, 도마를 함께 사용하나요?`
          ];
        }, [userAllergens, questionTargetMenu]);

        const handleAnalyzeStaffReply = () => {
          const mlClassification = MLClassifierPrototype.classifyText(staffReplyInput, userAllergens);
          const inference = InferenceEngine.evaluate(
            userAllergens,
            { ingredients: staffReplyInput, staffNote: staffReplyInput },
            mlClassification
          );
          const record = {
            id: `qa-rec-${Date.now()}`,
            targetName: `직원 확인: ${questionTargetMenu || "식당 메뉴"}`,
            inference,
            mlClassification,
            source: "STAFF_CONFIRMED",
            updatedAt: new Date().toISOString().split("T")[0]
          };
          setAnalysisHistory((prev) => [record, ...prev]);
          setSelectedDetailRecord(record);
          handleSpeak(`직원 답변 분석 결과: ${inference.statusLabel}. ${inference.summaryMessage}`);
        };

        const getStatusBadgeConfig = (status) => {
          switch (status) {
            case "ALLERGEN_DETECTED":
              return { bg: "bg-red-50 border-red-600 text-red-900", headerBg: "bg-red-600 text-white", badge: "bg-red-100 text-red-900 border-red-400", symbol: "⛔" };
            case "NEEDS_VERIFICATION":
              return { bg: "bg-orange-50 border-orange-500 text-orange-950", headerBg: "bg-orange-600 text-white", badge: "bg-orange-100 text-orange-900 border-orange-400", symbol: "⚠️" };
            case "INSUFFICIENT_INFO":
              return { bg: "bg-slate-100 border-slate-500 text-slate-900", headerBg: "bg-slate-700 text-white", badge: "bg-slate-200 text-slate-900 border-slate-400", symbol: "❓" };
            default:
              return { bg: "bg-emerald-50 border-emerald-600 text-emerald-950", headerBg: "bg-emerald-700 text-white", badge: "bg-emerald-100 text-emerald-900 border-emerald-400", symbol: "✅" };
          }
        };

        const filteredMenus =
          selectedRestaurantFilter === "ALL"
            ? restaurantMenus
            : restaurantMenus.filter((m) => m.restaurantId === selectedRestaurantFilter);

        return (
          <div className="min-h-screen bg-white text-slate-900 flex flex-col">
            {/* 상단 접근성 및 내비게이션 */}
            <header className="sticky top-0 z-40 bg-white border-b-2 border-emerald-700 shadow-sm">
              <div className="max-w-5xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 bg-emerald-950 text-white text-xs sm:text-sm">
                <span className="font-semibold">👁️ 접근성 및 음성 안내 설정</span>
                <div className="flex flex-wrap items-center gap-2">
                  <div className="flex items-center bg-emerald-900 rounded-lg p-0.5 border border-emerald-700">
                    <span className="px-2 text-emerald-200">글자:</span>
                    {[
                      { id: "normal", label: "보통" },
                      { id: "large", label: "크게" },
                      { id: "xlarge", label: "매우 크게" }
                    ].map((sz) => (
                      <button
                        key={sz.id}
                        type="button"
                        onClick={() => setFontScale(sz.id)}
                        className={`px-2.5 py-1 rounded-md font-bold transition ${
                          fontScale === sz.id ? "bg-white text-emerald-950" : "text-emerald-100 hover:bg-emerald-800"
                        }`}
                      >
                        {sz.label}
                      </button>
                    ))}
                  </div>

                  {isSpeaking ? (
                    <button type="button" onClick={handleStopSpeak} className="bg-orange-600 hover:bg-orange-500 text-white font-bold px-3 py-1.5 rounded-lg">
                      🔇 음성 중지
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={() =>
                        handleSpeak(`AI 식품 알레르기 경고 도우미입니다. 현재 등록된 내 알레르기는 ${userAllergens.length > 0 ? userAllergens.join(", ") : "없음"}입니다.`)
                      }
                      className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded-lg"
                    >
                      🔊 음성 안내 듣기
                    </button>
                  )}
                </div>
              </div>

              <div className="max-w-5xl mx-auto px-4 py-3">
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-3">
                  <button type="button" onClick={() => setActiveTab("home")} className="flex items-center gap-3 text-left">
                    <div className="w-11 h-11 rounded-xl bg-emerald-700 text-white flex items-center justify-center font-extrabold text-xl">🛡️</div>
                    <div>
                      <div className="flex items-center gap-2">
                        <h1 className="text-lg sm:text-xl font-extrabold text-emerald-950">세이프바이트 AI (SafeBite)</h1>
                        <span className="text-xs font-bold px-2 py-0.5 rounded-full bg-orange-100 text-orange-800 border border-orange-300">창업 시제품</span>
                      </div>
                      <p className="text-xs sm:text-sm text-slate-600 font-medium">추론 엔진 기반 개인 맞춤형 식품 알레르기 경고 도우미</p>
                    </div>
                  </button>

                  <div className="flex flex-wrap items-center gap-1.5 text-xs">
                    <span className="px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-900 border border-emerald-300 font-bold">핵심 AI: 규칙 기반 추론 엔진</span>
                    <span className="px-2.5 py-1 rounded-md bg-orange-50 text-orange-900 border border-orange-300 font-bold">보조 AI: ML 분류 프로토타입</span>
                  </div>
                </div>

                <nav className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2">
                  {[
                    { id: "home", label: "1. 메인 홈" },
                    { id: "allergies", label: "2. 알레르기 설정" },
                    { id: "packaged", label: "3. 포장식품 분석" },
                    { id: "restaurant", label: "4. 식당·QR 메뉴" },
                    { id: "register", label: "5. 식당 원재료 등록" },
                    { id: "question", label: "6. AI 질문·답변" }
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      type="button"
                      onClick={() => setActiveTab(tab.id)}
                      className={`px-3 py-2.5 rounded-xl font-bold text-sm border-2 transition ${
                        activeTab === tab.id
                          ? "bg-emerald-700 text-white border-emerald-700 shadow-sm"
                          : "bg-white text-slate-800 border-slate-200 hover:border-emerald-500 hover:bg-emerald-50"
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </nav>
              </div>
            </header>

            {/* 메인 콘텐츠 */}
            <main className="flex-1 max-w-5xl w-full mx-auto px-4 py-6 space-y-6">
              {activeTab === "home" && (
                <div className="space-y-6">
                  <section className="rounded-2xl border-2 border-emerald-700 bg-gradient-to-br from-emerald-50 via-white to-orange-50 p-6 shadow-sm">
                    <span className="inline-block px-3 py-1 rounded-full bg-emerald-700 text-white text-xs font-bold mb-2">
                      고등학생 창업 시제품 · 모두를 위한 식품 안전 AI
                    </span>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mb-2">
                      내 알레르기 정보로 원재료를 즉시 추론하고 경고합니다
                    </h2>
                    <p className="text-slate-700 leading-relaxed">
                      포장식품 라벨 사진과 식당 메뉴의 소스·육수·복합재료를 <strong>규칙 기반 추론 엔진</strong>으로 분석하고,
                      <strong>한국어 음성 안내(TTS)</strong>로 시각장애인도 독립적으로 확인할 수 있습니다.
                    </p>
                  </section>

                  <section className="rounded-2xl border-2 border-slate-200 bg-white p-5 shadow-sm">
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                      <div>
                        <h3 className="text-lg font-extrabold text-slate-900">현재 등록된 내 알레르기 유발 성분 ({userAllergens.length}개)</h3>
                        <p className="text-sm text-slate-600">모든 분석 시 아래 성분과 파생 원재료가 자동 매칭됩니다.</p>
                      </div>
                      <button type="button" onClick={() => setActiveTab("allergies")} className="px-4 py-2.5 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm">
                        알레르기 수정·추가하기
                      </button>
                    </div>
                    {userAllergens.length === 0 ? (
                      <div className="p-4 rounded-xl bg-orange-50 border border-orange-300 text-orange-900 font-medium">등록된 알레르기 성분이 없습니다.</div>
                    ) : (
                      <div className="flex flex-wrap gap-2">
                        {userAllergens.map((allergen) => (
                          <span key={allergen} className="px-3.5 py-2 rounded-xl bg-orange-100 text-orange-950 border-2 border-orange-400 font-extrabold text-sm">
                            ⚠️ {allergen}
                          </span>
                        ))}
                      </div>
                    )}
                  </section>

                  <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <button type="button" onClick={() => setActiveTab("packaged")} className="p-5 rounded-2xl border-2 border-emerald-600 bg-white hover:bg-emerald-50 text-left shadow-sm">
                      <div className="text-2xl mb-2">📷</div>
                      <h4 className="text-lg font-extrabold text-slate-900 mb-1">포장식품 원재료 분석</h4>
                      <p className="text-sm text-slate-600 mb-3">원재료 사진(OCR) 또는 직접 입력으로 파생 성분을 추론합니다.</p>
                      <span className="text-emerald-700 font-bold text-sm">분석 시작하기 →</span>
                    </button>

                    <button type="button" onClick={() => setActiveTab("restaurant")} className="p-5 rounded-2xl border-2 border-orange-500 bg-white hover:bg-orange-50 text-left shadow-sm">
                      <div className="text-2xl mb-2">📱</div>
                      <h4 className="text-lg font-extrabold text-slate-900 mb-1">식당 메뉴 & QR 확인</h4>
                      <p className="text-sm text-slate-600 mb-3">테이블 QR코드로 식당 메뉴별 원재료·소스·육수를 비교합니다.</p>
                      <span className="text-orange-700 font-bold text-sm">메뉴 확인하기 →</span>
                    </button>

                    <button type="button" onClick={() => setActiveTab("question")} className="p-5 rounded-2xl border-2 border-slate-300 bg-white hover:bg-slate-50 text-left shadow-sm">
                      <div className="text-2xl mb-2">💬</div>
                      <h4 className="text-lg font-extrabold text-slate-900 mb-1">AI 확인 질문 & 답변 분석</h4>
                      <p className="text-sm text-slate-600 mb-3">식당 직원 질문 자동 생성 및 직원 답변의 모호성을 분석합니다.</p>
                      <span className="text-slate-800 font-bold text-sm">질문 생성하기 →</span>
                    </button>
                  </section>

                  <section className="space-y-3">
                    <h3 className="text-lg font-extrabold text-slate-900">최근 분석 결과 이력 ({analysisHistory.length}건)</h3>
                    {analysisHistory.length === 0 ? (
                      <div className="p-6 rounded-2xl border-2 border-dashed border-slate-300 text-center text-slate-600">
                        아직 수행한 분석 기록이 없습니다.
                      </div>
                    ) : (
                      analysisHistory.map((item) => {
                        const badgeCfg = getStatusBadgeConfig(item.inference.status);
                        return (
                          <div key={item.id} className={`p-4 rounded-2xl border-2 ${badgeCfg.bg} flex flex-col sm:flex-row sm:items-center justify-between gap-3`}>
                            <div>
                              <div className="flex flex-wrap items-center gap-2">
                                <span className="font-extrabold">{badgeCfg.symbol} {item.inference.statusLabel}</span>
                                <span className="text-xs px-2 py-0.5 rounded-md bg-white border border-slate-300 font-semibold">{SOURCE_META[item.source].label}</span>
                              </div>
                              <p className="font-bold text-slate-900 mt-1">{item.targetName}</p>
                            </div>
                            <button type="button" onClick={() => setSelectedDetailRecord(item)} className="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold text-sm">
                              추론 근거 상세 보기
                            </button>
                          </div>
                        );
                      })
                    )}
                  </section>
                </div>
              )}

              {activeTab === "allergies" && (
                <section className="space-y-6">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <h2 className="text-2xl font-extrabold text-slate-900">개인별 알레르기 정보 설정</h2>
                    {userAllergens.length > 0 && (
                      <button type="button" onClick={handleClearAllAllergens} className="px-4 py-2 rounded-xl bg-red-600 text-white font-bold text-sm">
                        전체 삭제
                      </button>
                    )}
                  </div>

                  <div className="p-5 rounded-2xl border-2 border-slate-200 bg-white space-y-4">
                    <h3 className="font-extrabold text-slate-900">1. 주요 알레르기 유발 성분 선택</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2.5">
                      {COMMON_ALLERGENS.map((item) => {
                        const selected = userAllergens.includes(item);
                        return (
                          <button
                            key={item}
                            type="button"
                            onClick={() => toggleAllergen(item)}
                            className={`flex items-center justify-between px-4 py-3 rounded-xl border-2 font-bold text-sm ${
                              selected ? "bg-orange-600 text-white border-orange-600" : "bg-white text-slate-800 border-slate-200 hover:border-emerald-600"
                            }`}
                          >
                            <span>{item}</span>
                            <span>{selected ? "✓" : "+"}</span>
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <form onSubmit={handleAddCustomAllergen} className="p-5 rounded-2xl border-2 border-emerald-600 bg-emerald-50/50 space-y-3">
                    <label className="block font-extrabold text-slate-900">2. 목록에 없는 알레르기 성분 직접 추가</label>
                    <div className="flex flex-col sm:flex-row gap-2">
                      <input
                        type="text"
                        value={customAllergenInput}
                        onChange={(e) => setCustomAllergenInput(e.target.value)}
                        placeholder="예: 키위, 참깨, 셀러리"
                        className="flex-1 px-4 py-3 rounded-xl border-2 border-slate-300 bg-white"
                      />
                      <button type="submit" className="px-6 py-3 rounded-xl bg-emerald-700 text-white font-extrabold">성분 등록하기</button>
                    </div>
                  </form>
                </section>
              )}

              {activeTab === "packaged" && (
                <section className="space-y-6">
                  <h2 className="text-2xl font-extrabold text-slate-900">포장식품 원재료 분석</h2>
                  <div className="p-5 rounded-2xl border-2 border-emerald-600 bg-white space-y-4">
                    <h3 className="font-extrabold text-slate-900">1단계: 원재료 표시 사진 업로드 (OCR 시뮬레이션)</h3>
                    <div className="flex flex-wrap items-center gap-3">
                      <label className="cursor-pointer inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-emerald-700 text-white font-extrabold">
                        <span>📷 원재료 사진 선택</span>
                        <input type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />
                      </label>
                      {uploadedFileName && <span className="text-sm font-bold text-emerald-800 bg-emerald-50 px-3 py-2 rounded-lg">{uploadedFileName}</span>}
                    </div>
                    <div className="flex flex-wrap gap-2 pt-2 border-t border-slate-200">
                      {OCR_PRESETS.map((preset) => (
                        <button
                          key={preset.id}
                          type="button"
                          onClick={() => { setFoodNameInput(preset.productName); setOcrTextInput(preset.extractedText); }}
                          className="px-3 py-2 rounded-xl bg-slate-100 hover:bg-orange-100 border border-slate-300 text-xs font-bold"
                        >
                          {preset.label}
                        </button>
                      ))}
                    </div>
                    {isOcrProcessing && <p className="text-sm font-bold text-orange-800">텍스트 추출 중...</p>}
                  </div>

                  <div className="p-5 rounded-2xl border-2 border-slate-200 bg-white space-y-4">
                    <h3 className="font-extrabold text-slate-900">2단계: 제품명 및 원재료 텍스트 확인 (직접 수정 가능)</h3>
                    <input type="text" value={foodNameInput} onChange={(e) => setFoodNameInput(e.target.value)} className="w-full px-4 py-3 rounded-xl border-2 border-slate-300 font-medium" />
                    <textarea rows={4} value={ocrTextInput} onChange={(e) => setOcrTextInput(e.target.value)} className="w-full px-4 py-3 rounded-xl border-2 border-slate-300 font-medium" />
                    <button type="button" onClick={handleAnalyzePackagedFood} className="w-full py-4 rounded-xl bg-orange-600 hover:bg-orange-700 text-white font-extrabold text-lg">
                      AI 추론 엔진으로 알레르기 분석 실행 (음성 안내 포함)
                    </button>
                  </div>
                </section>
              )}

              {activeTab === "restaurant" && (
                <section className="space-y-6">
                  <h2 className="text-2xl font-extrabold text-slate-900">식당 메뉴 및 테이블 QR코드 확인</h2>
                  <div className="p-5 rounded-2xl border-2 border-emerald-700 bg-emerald-50/60 space-y-3">
                    <h3 className="font-extrabold text-emerald-950">📱 테이블 QR코드 스캔 시뮬레이터</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                      {[
                        { id: "ALL", sub: "전체 보기", title: "모든 식당 메뉴판 보기" },
                        { id: "REST-GREEN-01", sub: "QR 스캔 #1 (예시 데이터)", title: "초록숲 샐러드 & 파스타" },
                        { id: "REST-NOODLE-02", sub: "QR 스캔 #2 (예시 데이터)", title: "한그릇 온면집" }
                      ].map((qr) => (
                        <button
                          key={qr.id}
                          type="button"
                          onClick={() => handleSimulateQrScan(qr.id, qr.title)}
                          className={`p-3 rounded-xl border-2 font-bold text-sm text-left ${
                            selectedRestaurantFilter === qr.id ? "bg-emerald-700 text-white border-emerald-700" : "bg-white text-slate-800 border-slate-300"
                          }`}
                        >
                          <div className="text-xs opacity-80">{qr.sub}</div>
                          <div>{qr.title}</div>
                        </button>
                      ))}
                    </div>
                    {qrScanNotice && <div className="p-3 rounded-xl bg-white border-2 border-emerald-600 text-emerald-950 font-bold text-sm">{qrScanNotice}</div>}
                  </div>

                  <div className="space-y-4">
                    {filteredMenus.map((menu) => {
                      const liveInference = InferenceEngine.evaluate(userAllergens, menu);
                      const statusCfg = getStatusBadgeConfig(liveInference.status);
                      return (
                        <article key={menu.id} className={`rounded-2xl border-2 p-5 space-y-3 ${statusCfg.bg}`}>
                          <div className="flex flex-wrap items-start justify-between gap-3">
                            <div>
                              <div className="flex flex-wrap items-center gap-2">
                                <span className="text-xs font-extrabold px-2.5 py-0.5 rounded-md bg-slate-900 text-white">{menu.restaurantName}</span>
                                {menu.isSampleData && <span className="text-xs font-bold px-2 py-0.5 rounded-md bg-amber-200 text-amber-950">시연용 예시 데이터</span>}
                                <span className={`text-xs font-bold px-2 py-0.5 rounded-md border ${SOURCE_META[menu.source].badgeClass}`}>{SOURCE_META[menu.source].label}</span>
                              </div>
                              <h3 className="text-xl font-extrabold text-slate-950 mt-1">{menu.menuName}</h3>
                              <p className="text-xs text-slate-700">최종 업데이트: {menu.updatedAt}</p>
                            </div>
                            <div className={`px-3.5 py-2 rounded-xl border-2 font-extrabold text-sm ${statusCfg.badge}`}>
                              {statusCfg.symbol} {liveInference.statusLabel}
                            </div>
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-white/90 p-3.5 rounded-xl border border-slate-300 text-sm">
                            <div><strong>주원재료:</strong> {menu.ingredients || "미등록"}</div>
                            <div><strong>소스/양념:</strong> {menu.sauce || "미등록"}</div>
                            <div><strong>육수/베이스:</strong> {menu.broth || "미등록"}</div>
                            <div><strong>토핑/고명:</strong> {menu.topping || "미등록"}</div>
                          </div>

                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <p className="text-sm font-bold text-slate-900">{liveInference.summaryMessage}</p>
                            <div className="flex gap-2">
                              <button type="button" onClick={() => { setQuestionTargetMenu(menu.menuName); setActiveTab("question"); }} className="px-3 py-2 rounded-xl bg-white border-2 border-slate-400 font-bold text-xs">
                                질문 생성하기
                              </button>
                              <button type="button" onClick={() => handleInspectRestaurantMenu(menu)} className="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold text-xs">
                                상세 근거 & 음성 안내
                              </button>
                            </div>
                          </div>
                        </article>
                      );
                    })}
                  </div>
                </section>
              )}

              {activeTab === "register" && (
                <section className="space-y-6">
                  <h2 className="text-2xl font-extrabold text-slate-900">식당 메뉴 원재료 정보 등록 (사장님 모드)</h2>
                  {registerFeedback && <div className="p-4 rounded-2xl bg-emerald-50 border-2 border-emerald-600 text-emerald-950 font-bold">{registerFeedback}</div>}
                  <form onSubmit={handleRegisterRestaurantMenu} className="p-6 rounded-2xl border-2 border-slate-200 bg-white space-y-4">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <input type="text" value={regRestaurantName} onChange={(e) => setRegRestaurantName(e.target.value)} placeholder="식당명" className="px-4 py-3 rounded-xl border-2 border-slate-300" />
                      <input type="text" required value={regMenuName} onChange={(e) => setRegMenuName(e.target.value)} placeholder="메뉴명 (필수) *" className="px-4 py-3 rounded-xl border-2 border-slate-300" />
                    </div>
                    <textarea rows={2} required value={regIngredients} onChange={(e) => setRegIngredients(e.target.value)} placeholder="주원재료 및 복합재료 (필수) *" className="w-full px-4 py-3 rounded-xl border-2 border-slate-300" />
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      <input type="text" value={regSauce} onChange={(e) => setRegSauce(e.target.value)} placeholder="소스 / 양념" className="px-4 py-3 rounded-xl border-2 border-slate-300" />
                      <input type="text" value={regBroth} onChange={(e) => setRegBroth(e.target.value)} placeholder="육수 / 베이스" className="px-4 py-3 rounded-xl border-2 border-slate-300" />
                      <input type="text" value={regTopping} onChange={(e) => setRegTopping(e.target.value)} placeholder="토핑 / 고명" className="px-4 py-3 rounded-xl border-2 border-slate-300" />
                    </div>
                    <button type="submit" className="w-full py-4 rounded-xl bg-emerald-700 text-white font-extrabold text-lg">메뉴 원재료 데이터베이스에 등록하기</button>
                  </form>
                </section>
              )}

              {activeTab === "question" && (
                <section className="space-y-6">
                  <h2 className="text-2xl font-extrabold text-slate-900">식당 알레르기 확인 질문 생성 & 답변 분석</h2>
                  <div className="p-5 rounded-2xl border-2 border-emerald-600 bg-white space-y-4">
                    <input type="text" value={questionTargetMenu} onChange={(e) => setQuestionTargetMenu(e.target.value)} placeholder="메뉴명 입력" className="w-full px-4 py-3 rounded-xl border-2 border-slate-300 font-bold" />
                    <div className="space-y-3">
                      {generatedQuestions.map((q, idx) => (
                        <div key={idx} className="p-4 rounded-xl bg-emerald-50 border border-emerald-300 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                          <p className="font-bold text-slate-900 text-sm">{idx + 1}. {q}</p>
                          <div className="flex gap-2 shrink-0">
                            <button type="button" onClick={() => handleSpeak(q)} className="px-3 py-2 rounded-lg bg-emerald-700 text-white font-bold text-xs">🔊 음성 전달</button>
                            <button type="button" onClick={() => { navigator.clipboard && navigator.clipboard.writeText(q); setCopiedQuestionIdx(idx); setTimeout(() => setCopiedQuestionIdx(null), 1500); }} className="px-3 py-2 rounded-lg bg-white border border-slate-300 font-bold text-xs">
                              {copiedQuestionIdx === idx ? "복사됨" : "복사"}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="p-5 rounded-2xl border-2 border-orange-500 bg-white space-y-4">
                    <h3 className="font-extrabold text-slate-900">식당 직원의 답변 입력 및 AI 분석</h3>
                    <textarea rows={3} value={staffReplyInput} onChange={(e) => setStaffReplyInput(e.target.value)} className="w-full px-4 py-3 rounded-xl border-2 border-slate-300" />
                    <button type="button" onClick={handleAnalyzeStaffReply} className="w-full py-4 rounded-xl bg-orange-600 text-white font-extrabold text-lg">
                      직원 답변 AI 분류 및 최종 알레르기 추론 실행
                    </button>
                  </div>
                </section>
              )}
            </main>

            {/* 상세 분석 결과 모달 */}
            {selectedDetailRecord && (
              <div className="fixed inset-0 z-50 bg-slate-950/70 flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
                <div className="bg-white w-full max-w-3xl rounded-3xl border-2 border-slate-300 shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">
                  {(() => {
                    const cfg = getStatusBadgeConfig(selectedDetailRecord.inference.status);
                    return (
                      <div className={`${cfg.headerBg} px-6 py-5 flex items-start justify-between gap-4`}>
                        <div>
                          <span className="text-xs font-bold opacity-90">AI 추론 엔진 최종 판단 결과</span>
                          <h2 className="text-xl sm:text-2xl font-extrabold">{cfg.symbol} {selectedDetailRecord.inference.statusLabel}</h2>
                          <p className="text-sm opacity-95 mt-1">대상: {selectedDetailRecord.targetName}</p>
                        </div>
                        <button type="button" onClick={() => setSelectedDetailRecord(null)} className="px-3.5 py-2 rounded-xl bg-black/25 text-white font-bold text-sm">닫기 ✕</button>
                      </div>
                    );
                  })()}

                  <div className="p-6 overflow-y-auto space-y-5">
                    <div className="p-4 rounded-2xl bg-slate-50 border-2 border-slate-200 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-extrabold text-slate-600">종합 판단 안내</span>
                        <button
                          type="button"
                          onClick={() => handleSpeak(`판단 결과: ${selectedDetailRecord.inference.statusLabel}. ${selectedDetailRecord.inference.summaryMessage}`)}
                          className="px-3 py-1.5 rounded-xl bg-emerald-700 text-white font-bold text-xs"
                        >
                          🔊 전체 결과 음성으로 듣기
                        </button>
                      </div>
                      <p className="font-extrabold text-slate-900">{selectedDetailRecord.inference.summaryMessage}</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
                      <div className="p-4 rounded-2xl border-2 border-slate-200">
                        <div className="text-xs font-bold text-slate-500">정보 출처</div>
                        <div className="font-extrabold">{SOURCE_META[selectedDetailRecord.source].label}</div>
                      </div>
                      <div className="p-4 rounded-2xl border-2 border-slate-200">
                        <div className="text-xs font-bold text-slate-500">최종 업데이트 날짜</div>
                        <div className="font-extrabold">{selectedDetailRecord.updatedAt}</div>
                      </div>
                    </div>

                    {selectedDetailRecord.inference.matchedAllergens.length > 0 && (
                      <div className="p-4 rounded-2xl bg-red-50 border-2 border-red-400 space-y-1.5">
                        <h3 className="font-extrabold text-red-900">탐지된 알레르기 유발 성분</h3>
                        {selectedDetailRecord.inference.matchedAllergens.map((m, i) => (
                          <p key={i} className="text-sm font-bold text-red-950">• 내 알레르기 [{m.userAllergen}] → [{m.location}]에서 &apos;{m.matchedKeyword}&apos; 확인됨</p>
                        ))}
                      </div>
                    )}

                    {selectedDetailRecord.inference.ambiguousItems.length > 0 && (
                      <div className="p-4 rounded-2xl bg-orange-50 border-2 border-orange-400 space-y-1.5">
                        <h3 className="font-extrabold text-orange-950">추가 확인이 필요한 항목</h3>
                        {selectedDetailRecord.inference.ambiguousItems.map((item, i) => (
                          <p key={i} className="text-sm font-bold text-orange-950">• {item}</p>
                        ))}
                      </div>
                    )}

                    <div className="p-4 rounded-2xl border-2 border-emerald-600 bg-emerald-50/40 space-y-2">
                      <h3 className="font-extrabold text-emerald-950">핵심 AI: 규칙 기반 추론 과정 (Rule Trace)</h3>
                      {selectedDetailRecord.inference.ruleTrace.map((rule) => (
                        <div key={rule.ruleId} className={`p-3 rounded-xl border text-xs ${rule.triggered ? "bg-white border-emerald-600" : "bg-slate-50 border-slate-200 opacity-70"}`}>
                          <div className="font-extrabold">[{rule.ruleId}] {rule.ruleName} — {rule.triggered ? "적용됨" : "통과"}</div>
                          <p className="text-slate-700 mt-1">{rule.description}</p>
                        </div>
                      ))}
                    </div>

                    <div className="p-4 rounded-2xl border-2 border-slate-300 bg-slate-50 space-y-2 text-xs">
                      <h3 className="font-extrabold text-slate-900 text-sm">보조 AI: 텍스트 분류 분석 결과</h3>
                      <p className="font-bold text-orange-800">{selectedDetailRecord.mlClassification.isPrototypeNotice}</p>
                      <p><strong>① 알레르기 성분 언급:</strong> {selectedDetailRecord.mlClassification.hasAllergenMention.detected ? selectedDetailRecord.mlClassification.hasAllergenMention.extractedAllergens.join(", ") : "미감지"}</p>
                      <p><strong>② 복합재료 추출:</strong> {selectedDetailRecord.mlClassification.ingredientsAndCompounds.compoundIngredients.join(", ") || "없음"}</p>
                      <p><strong>③ 소스·육수 추출:</strong> {selectedDetailRecord.mlClassification.sauceAndBrothInfo.extractedTerms.join(", ") || "없음"}</p>
                      <p><strong>④ 답변 모호성 판별:</strong> {selectedDetailRecord.mlClassification.ambiguityAnalysis.reason}</p>
                    </div>
                  </div>

                  <div className="px-6 py-4 bg-slate-100 border-t flex justify-end">
                    <button type="button" onClick={() => setSelectedDetailRecord(null)} className="px-6 py-3 rounded-xl bg-slate-900 text-white font-extrabold text-sm">확인 완료</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
